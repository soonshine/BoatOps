server {
    listen 80;
    listen [::]:80;
    server_name boatops.ayany.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/boatops.ayany.com/current/public;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://boatops.ayany.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 127.0.0.1:18081;
    server_name boatops.ayany.com;

    root /www/wwwroot/boatops.ayany.com/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 2m;

    access_log /www/wwwlogs/boatops.ayany.com.log;
    error_log /www/wwwlogs/boatops.ayany.com.error.log;

    ssl_certificate /www/server/panel/vhost/letsencrypt/boatops.ayany.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/boatops.ayany.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:BOATOPS_SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi.conf;
        fastcgi_pass unix:/tmp/php-cgi-84.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
