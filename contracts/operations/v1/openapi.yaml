openapi: 3.1.0
info:
  title: BoatOps Internal Operations API
  version: 1.0.0-alpha.5
  summary: Private operations commands and operator schedule catalog/calendar reads.
  description: >-
    Private alpha contract. Inventory and trip commands require operations.write.
    Finance writes require operations.finance.write, and finance reads require
    operations.finance.read or operations.finance.write. Schedule reads require
    operations.schedule.read or operations.schedule.write; schedule writes require
    operations.schedule.write. Schedule catalog writes use canonical server-owned
    identities and audit logs. This API is not part of the channel-facing Inventory
    Provider API and must not be exposed to untrusted channel clients.
servers:
  - url: https://boatops.ayany.com
    description: Ayany private alpha target
  - url: http://localhost:8000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Blocks
    description: Explicit resource unavailability intervals with immutable history.
  - name: Trips
    description: Private crew readiness and trip execution state commands.
  - name: Schedule
    description: Organization-scoped operator slot catalog, compatibility, and bounded allocation-backed calendar.
  - name: Finance setup
    description: Private payment-source, expense-category, and stock-item masters.
  - name: Operating costs
    description: Private fuel, expense, stock movement, and trip cost records.
paths:
  /api/internal/v1/blocks:
    post:
      tags: [Blocks]
      operationId: createBlock
      summary: Block one boat for an explicit UTC interval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlockRequest'
      responses:
        '201':
          description: Block and active allocation created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockCommandResponse'
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/blocks/{id}:release:
    post:
      tags: [Blocks]
      operationId: releaseBlock
      summary: Release an active resource block
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseBlockRequest'
      responses:
        '200':
          description: Block released and inventory revision advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockCommandResponse'
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/trips/{id}:prepare:
    post:
      tags: [Trips]
      operationId: prepareTrip
      summary: Atomically freeze crew assignments and checklist state for a planned trip
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareTripRequest'
      responses:
        '200':
          description: Trip preparation saved; response exposes counts only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPreparedResponse'
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/trips/{id}:depart:
    post:
      tags: [Trips]
      operationId: departTrip
      summary: Mark a fully prepared planned trip as departed
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartTripRequest'
      responses:
        '200':
          description: Trip departed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripCommandResponse'
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/trips/{id}:return:
    post:
      tags: [Trips]
      operationId: returnTrip
      summary: Mark a departed trip as returned
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnTripRequest'
      responses:
        '200':
          description: Trip returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripCommandResponse'
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/trips/{id}:complete:
    post:
      tags: [Trips]
      operationId: completeTrip
      summary: Complete a returned trip and release its booking allocation
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Trip and booking completed; inventory revision advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripCommandResponse'
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/schedule/slot-offerings:
    get:
      tags: [Schedule]
      operationId: listSlotOfferings
      summary: List the organization slot catalog and canonical compatibility rules
      description: Requires operations.schedule.read or operations.schedule.write.
      responses:
        '200':
          description: Organization-scoped presets, custom templates, instances, status, boat scope, and rules.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlotCatalogResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
    post:
      tags: [Schedule]
      operationId: createSlotOffering
      summary: Create a reusable custom slot definition
      description: Requires operations.schedule.write. Clock times remain unverified until operating rules are frozen.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSlotOfferingRequest'}
      responses:
        '201':
          description: New immutable-identity reusable definition and audit row created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlotOfferingCommandResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/schedule/custom-slot-instances:
    post:
      tags: [Schedule]
      operationId: createCustomSlotInstance
      summary: Create a date-specific custom slot instance or template override
      description: >-
        Requires operations.schedule.write. The fictional FULL_DAY_6H 12:00-18:00
        validation scenario must be represented here, not by changing the reusable preset.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCustomSlotInstanceRequest'}
      responses:
        '201':
          description: Date-specific custom identity and audit row created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomSlotInstanceCommandResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/schedule/compatibility-rules:
    post:
      tags: [Schedule]
      operationId: setSlotCompatibilityRule
      summary: Canonically upsert one ALLOW or DENY rule for an unordered slot pair
      description: Requires operations.schedule.write. Every modification creates an audit row.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetSlotCompatibilityRuleRequest'}
      responses:
        '200':
          description: The single canonical pair rule was created or updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompatibilityRuleCommandResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/schedule/slot-offerings/{id}:activate:
    post:
      tags: [Schedule]
      operationId: activateSlotOffering
      summary: Transition a DRAFT slot definition to ACTIVE
      description: Requires operations.schedule.write and creates an audit row.
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Definition activated for future selection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlotOfferingCommandResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/internal/v1/schedule/slot-offerings/{id}:retire:
    post:
      tags: [Schedule]
      operationId: retireSlotOffering
      summary: Transition a DRAFT or ACTIVE slot definition to RETIRED
      description: >-
        Requires operations.schedule.write and creates an audit row. RETIRED prevents
        future selection but never changes historical HOLD/allocation/booking snapshots.
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Definition retired without deleting history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlotOfferingCommandResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/internal/v1/schedule/calendar:
    get:
      tags: [Schedule]
      operationId: getScheduleCalendar
      summary: Read at most 31 organization-local inventory dates
      description: >-
        Requires operations.schedule.read or operations.schedule.write. This bounded
        projection is backed by ACTIVE allocations and is not a new inventory truth.
        Availability and HOLD transactions always re-adjudicate final inventory. No
        customer contact, lodging, price, payment, or seat inventory fields are returned.
        Seeded clock times are DEMO DEFAULT / UNVERIFIED OPERATING TIME.
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          description: Inclusive; from through to may contain at most 31 local dates.
          schema: {type: string, format: date}
        - name: boat_id
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Allocation-backed whole-boat slot projection with stable conflict codes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduleCalendarResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/finance/accounts:
    post:
      tags: [Finance setup]
      operationId: createCashAccount
      summary: Create a payment-source account master
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCashAccountRequest'}
      responses:
        '201':
          description: Cash or payment-source account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupCommandResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/finance/accounts/{id}/activity:
    get:
      tags: [Finance reads]
      operationId: getCashAccountActivity
      summary: Read bounded cash posting activity for one organization account
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: Postings in the UTC half-open interval, ordered by occurred_at and id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashAccountActivityResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/finance/accounts/{id}/daily-summary:
    get:
      tags: [Finance reads]
      operationId: getCashAccountDailySummary
      summary: Summarize cash postings for one organization business date
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Single-currency account totals over the timezone-derived UTC half-open interval.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashAccountDailySummaryResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/finance/expense-categories:
    post:
      tags: [Finance setup]
      operationId: createExpenseCategory
      summary: Create an operating-expense category
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateExpenseCategoryRequest'}
      responses:
        '201':
          description: Expense category created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupCommandResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/stock/items:
    post:
      tags: [Finance setup]
      operationId: createStockItem
      summary: Create a beverage, food, cleaning, safety, or maintenance stock item
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateStockItemRequest'}
      responses:
        '201':
          description: Stock item created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupCommandResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/fuel-logs:
    post:
      tags: [Operating costs]
      operationId: recordFuelLog
      summary: Record a posted fuel purchase for a boat and optional trip
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordFuelLogRequest'}
      responses:
        '201':
          description: Fuel log posted and audited.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FuelLogResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/expenses:
    post:
      tags: [Operating costs]
      operationId: recordExpense
      summary: Record one posted operating expense with one or more category lines
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordExpenseRequest'}
      responses:
        '201':
          description: Expense and lines posted atomically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExpenseResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/stock/movements:
    post:
      tags: [Operating costs]
      operationId: recordStockMovement
      summary: Post a purchase, load, consumption, return, waste, or adjustment movement
      description: >-
        The item row is locked while balances are updated. LOAD and RETURN transfer cost
        between warehouse and boat balances. CONSUME and WASTE recognize cost at the
        source moving-average unit cost. A movement that would create negative stock fails.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordStockMovementRequest'}
      responses:
        '201':
          description: Stock movement and all affected balances posted atomically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovementResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/fuel-logs/{id}:reverse:
    post:
      tags: [Operating costs]
      operationId: reverseFuelLog
      summary: Reverse one posted fuel log
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReverseRecordRequest'}
      responses:
        '201': {$ref: '#/components/responses/ReversalCreated'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/expenses/{id}:reverse:
    post:
      tags: [Operating costs]
      operationId: reverseExpense
      summary: Reverse one posted expense
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReverseRecordRequest'}
      responses:
        '201': {$ref: '#/components/responses/ReversalCreated'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/stock/movements/{id}:reverse:
    post:
      tags: [Operating costs]
      operationId: reverseStockMovement
      summary: Reverse one posted stock movement
      description: Posts one exact-value REVERSAL compensation atomically. Compensations cannot be reversed.
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReverseRecordRequest'}
      responses:
        '201': {$ref: '#/components/responses/ReversalCreated'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/trips/{id}/cost-summary:
    get:
      tags: [Operating costs]
      operationId: getTripCostSummary
      summary: Return posted direct operating costs grouped by currency
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Fuel, expense, and consumed/wasted stock cost summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TripCostSummaryResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
  /api/internal/v1/boats/{id}/daily-cost-summary:
    get:
      tags: [Operating costs]
      operationId: getBoatDailyCostSummary
      summary: Return one boat's posted operating costs for a local business date
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
          description: Business date interpreted in the organization's configured timezone.
      responses:
        '200':
          description: Daily direct costs and the exact UTC interval used.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoatDailyCostSummaryResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/internal/v1/stock/balances:
    get:
      tags: [Operating costs]
      operationId: getStockBalances
      summary: Return warehouse or boat stock balances with moving-average value
      parameters:
        - name: boat_id
          in: query
          schema: {type: integer, minimum: 1}
        - name: item_id
          in: query
          schema: {type: integer, minimum: 1}
        - name: location_type
          in: query
          schema: {type: string, enum: [WAREHOUSE, BOAT]}
      responses:
        '200':
          description: Matching stock balances.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockBalancesResponse'}
        '403': {$ref: '#/components/responses/AuthorizationFailed'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque API token with explicit operations, finance, or schedule scope
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 255
    ObjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    AuthorizationFailed:
      description: Authentication, organization isolation, or required operation scope failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Inventory, state, readiness, external-reference, or idempotency conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ReversalCreated:
      description: Reversal, audit, idempotency record, and status or compensation committed atomically.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FinanceReversalResponse'}
  schemas:
    CreateSlotOfferingRequest:
      type: object
      additionalProperties: false
      required: [code, name, service_start_time, service_end_time, duration_minutes]
      properties:
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,99}$', maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 255}
        status: {type: string, enum: [DRAFT, ACTIVE], default: DRAFT}
        service_start_time: {type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$'}
        service_end_time: {type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$'}
        duration_minutes: {type: integer, minimum: 1, maximum: 1440}
        additional_buffer_before_minutes: {type: integer, minimum: 0, maximum: 1440, default: 0}
        additional_buffer_after_minutes: {type: integer, minimum: 0, maximum: 1440, default: 0}
        valid_from: {type: [string, 'null'], format: date}
        valid_until: {type: [string, 'null'], format: date}
        applies_to_all_boats: {type: boolean, default: true}
        boat_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: integer, minimum: 1}
    CreateCustomSlotInstanceRequest:
      type: object
      additionalProperties: false
      required: [code, service_date]
      properties:
        template_slot_offering_id: {type: [integer, 'null'], minimum: 1}
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,99}$', maxLength: 100}
        name: {type: [string, 'null'], minLength: 1, maxLength: 255}
        status: {type: string, enum: [DRAFT, ACTIVE], default: DRAFT}
        service_date: {type: string, format: date}
        service_start_time: {type: [string, 'null'], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$'}
        service_end_time: {type: [string, 'null'], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$'}
        duration_minutes: {type: [integer, 'null'], minimum: 1, maximum: 1440}
        additional_buffer_before_minutes: {type: integer, minimum: 0, maximum: 1440, default: 0}
        additional_buffer_after_minutes: {type: integer, minimum: 0, maximum: 1440, default: 0}
        applies_to_all_boats: {type: boolean, default: true}
        boat_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: integer, minimum: 1}
    SetSlotCompatibilityRuleRequest:
      type: object
      additionalProperties: false
      required: [first_slot_offering_id, second_slot_offering_id, policy]
      properties:
        first_slot_offering_id: {type: integer, minimum: 1}
        second_slot_offering_id: {type: integer, minimum: 1}
        policy: {type: string, enum: [ALLOW, DENY]}
        reason: {type: [string, 'null'], maxLength: 500}
    SlotOffering:
      type: object
