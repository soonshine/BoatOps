name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      NPM_CONFIG_IGNORE_SCRIPTS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, xml
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Validate dependency manifests
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Run PHP tests
        run: vendor/bin/phpunit

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Validate API contracts and event fixtures
        run: npm run test:contract

      - name: Build frontend assets
        run: npm run build

      - name: Verify migration round trip
        env:
          DB_DATABASE: ${{ runner.temp }}/boatops-ci.sqlite
        run: |
          touch "$DB_DATABASE"
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:rollback --step=1 --force --no-interaction
          php artisan migrate --force --no-interaction

      - name: Audit dependencies
        run: |
          composer audit --locked
          npm audit --audit-level=high

      - name: Check whitespace
        run: git diff --check
