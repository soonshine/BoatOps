name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      NPM_CONFIG_IGNORE_SCRIPTS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, xml
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Validate dependency manifests
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Run PHP tests
        run: vendor/bin/phpunit

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Validate API contracts and event fixtures
        run: npm run test:contract

      - name: Build frontend assets
        run: npm run build

      - name: Verify migration round trip
        env:
          DB_DATABASE: ${{ runner.temp }}/boatops-ci.sqlite
        run: |
          touch "$DB_DATABASE"
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:rollback --step=1 --force --no-interaction
          php artisan migrate --force --no-interaction

      - name: Audit dependencies
        run: |
          composer audit --locked
          npm audit --audit-level=high

      - name: Check whitespace
        run: git diff --check

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: boatops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boatops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: boatops_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      BOATOPS_TOKEN: fictional-ci-token-0000000000000001
      BOATOPS_BASE_URL: http://127.0.0.1:18080
      BOATOPS_CONCURRENCY: "16"
      PHP_CLI_SERVER_WORKERS: "4"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_pgsql, xml
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PostgreSQL migration and real HTTP concurrency gates
        run: bash tests/load/ci-postgres.sh
