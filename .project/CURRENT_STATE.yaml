    - "WP2 Minimal Operator Booking Workbench"
    - "WP3 Shared Trip Actions + Minimal Operator Trip Desk + Safety Repair"
  trip_status_contract:
    add_prepared_status: false
    preserved_flow: "PLANNED -> DEPARTED -> RETURNED -> COMPLETED"
    preparation_semantics: "Readiness attached to PLANNED; amendment invalidates readiness."
  explicit_exclusions:
    - ChannelHub
    - OTA
    - WordPress inventory integration
    - payment gateway
    - full accounting/receivables/refunds/profit
    - broad stock/fuel UI expansion
    - CRM
    - complex SaaS administration
    - automated historical migration
    - notification center
    - reporting platform
    - maintenance management
    - vessel document management
    - complex passenger manifest
    - second-company onboarding
    - public semantic-version release

